name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Manual rebuild, e.g. to pick up CMS content without pushing a commit.
  workflow_dispatch:
  # Called by cms-rebuild.yml and publish-scheduled.yml when blog content changes.
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# Every deploy rebuilds the whole site, so the newest one always wins. Pull
# requests only build, each in its own group, so they never cancel a deploy.
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('pages-pr-{0}', github.ref) || 'pages' }}
  cancel-in-progress: true

# The scanners run from their official images at a pinned version, not through
# third-party actions: gitleaks-action needs a licence for organization repos,
# and trivy-action had its tags rewritten in a 2026 supply-chain attack.
# Dependabot does not see these two, so bump them by hand.
env:
  GITLEAKS_VERSION: v8.30.1
  TRIVY_VERSION: 0.76.1

jobs:
  # Nothing is built or deployed unless both scans pass.
  security:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # Gitleaks reads the whole history: a secret removed in a later
          # commit is still published.
          fetch-depth: 0

      - name: Gitleaks, secrets in the code and its history
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:$GITLEAKS_VERSION
          git /repo --redact --no-banner --verbose

      # Both lockfiles, the site's and the Studio's. HIGH and CRITICAL with a fix
      # available fail the run; the fix is an upgrade, or an override in
      # studio/pnpm-workspace.yaml for a transitive dependency.
      - name: Trivy, known vulnerabilities in the dependencies
        run: >-
          docker run --rm -v "$PWD:/src" ghcr.io/aquasecurity/trivy:$TRIVY_VERSION
          fs /src --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed
          --exit-code 1 --no-progress

  build:
    needs: security
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # pnpm 12 checks the lockfile against its supply-chain policy (releases
      # younger than a day are refused) on every frozen install.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 12

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "26"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm run build

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./out

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Setup Pages
        uses: actions/configure-pages@v6

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
